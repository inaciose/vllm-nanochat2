[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-nanochat2"
version = "0.1.0"
description = "Plugin do vLLM para modelos nanochat convertidos para o formato Hugging Face"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
nanochat2 = "vllm_nanochat2:register"

[tool.setuptools]
packages = ["vllm_nanochat2"]
